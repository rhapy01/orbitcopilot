 <script>
  (function () {
   try {
    var k = "orbit-theme";
    var t = localStorage.getItem(k) || "light";
    if (t === "system") {
     t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.classList.add(t === "dark" ? "dark" : "light");
   } catch (e) {}
  })();
 </script>
